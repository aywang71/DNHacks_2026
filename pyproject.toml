[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-rendezvous"
version = "0.1.0"
description = "Provider-neutral AIS ingestion for auditable dark-gap analysis"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "shapely>=2.0,<3",
  "zstandard>=0.22,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
dark-rendezvous = "dark_rendezvous.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
